name: Build and Release Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create/update (for example: v1.0.0)'
        required: true
        type: string
      onnxruntime_version:
        description: 'ONNX Runtime version'
        required: false
        default: '1.18.1'
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    env:
      BUILD_TYPE: Release
      LOCAL_VCPKG_DIR: ${{ github.workspace }}\\local-vcpkg
      ONNXRUNTIME_VERSION: ${{ github.event.inputs.onnxruntime_version || '1.18.1' }}
      CMAKE_BUILD_PARALLEL_LEVEL: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LOCAL_VCPKG_DIR }}\\downloads
            ${{ env.LOCAL_VCPKG_DIR }}\\installed
            ${{ env.LOCAL_VCPKG_DIR }}\\packages
            ${{ env.LOCAL_VCPKG_DIR }}\\buildtrees
          key: ${{ runner.os }}-vcpkg-opencv4-core-dnn-x64-${{ hashFiles('CMakeLists.txt', '.github/workflows/windows-release.yml') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-opencv4-core-dnn-x64-

      - name: Setup vcpkg and install OpenCV
        shell: pwsh
        run: |
          $env:VCPKG_MAX_CONCURRENCY = $env:NUMBER_OF_PROCESSORS
          if (-not (Test-Path "$env:LOCAL_VCPKG_DIR\\vcpkg.exe")) {
            $vcpkgTempDir = Join-Path $env:RUNNER_TEMP "vcpkg-src"
            if (Test-Path $vcpkgTempDir) {
              Remove-Item -Path $vcpkgTempDir -Recurse -Force
            }

            git clone --depth 1 https://github.com/microsoft/vcpkg "$vcpkgTempDir"

            New-Item -ItemType Directory -Path "$env:LOCAL_VCPKG_DIR" -Force | Out-Null
            Copy-Item "$vcpkgTempDir\\*" "$env:LOCAL_VCPKG_DIR" -Recurse -Force

            & "$env:LOCAL_VCPKG_DIR\\bootstrap-vcpkg.bat" -disableMetrics
          }
          & "$env:LOCAL_VCPKG_DIR\\vcpkg.exe" --vcpkg-root "$env:LOCAL_VCPKG_DIR" --disable-metrics install opencv4[core,dnn]:x64-windows

      - name: Download ONNX Runtime
        shell: pwsh
        run: |
          $zipName = "onnxruntime-win-x64-$env:ONNXRUNTIME_VERSION.zip"
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v$env:ONNXRUNTIME_VERSION/$zipName"
          Invoke-WebRequest -Uri $url -OutFile $zipName
          Expand-Archive -Path $zipName -DestinationPath $env:GITHUB_WORKSPACE -Force
          $onnxDir = Join-Path $env:GITHUB_WORKSPACE "onnxruntime-win-x64-$env:ONNXRUNTIME_VERSION"
          "ONNXRUNTIME_DIR=$onnxDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=$env:BUILD_TYPE `
            -DCMAKE_TOOLCHAIN_FILE="$env:LOCAL_VCPKG_DIR\\scripts\\buildsystems\\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DONNXRUNTIME_DIR="$env:ONNXRUNTIME_DIR" `
            -DYOLOV8_ENABLE_CUDA_PROVIDER=OFF

      - name: Build executable
        shell: pwsh
        run: |
          cmake --build build --config $env:BUILD_TYPE --parallel $env:NUMBER_OF_PROCESSORS --target yolov8_example

      - name: Package executable
        id: package
        shell: pwsh
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE dist
          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          Copy-Item "build\\Release\\yolov8_example.exe" -Destination $dist -Force

          $onnxDll = Join-Path $env:ONNXRUNTIME_DIR "lib\\onnxruntime.dll"
          if (Test-Path $onnxDll) {
            Copy-Item $onnxDll -Destination $dist -Force
          }

          $vcpkgBin = Join-Path $env:LOCAL_VCPKG_DIR "installed\\x64-windows\\bin"
          if (-not (Test-Path $vcpkgBin)) {
            throw "vcpkg runtime bin folder not found: $vcpkgBin"
          }

          # Copy all vcpkg runtime DLLs so transitive deps (zlib/protobuf/abseil/etc.) are included.
          Get-ChildItem -Path $vcpkgBin -Filter "*.dll" | ForEach-Object {
            Copy-Item $_.FullName -Destination $dist -Force
          }

          $requiredDllPatterns = @("opencv*.dll", "*protobuf*.dll", "abseil*.dll", "z*.dll")
          foreach ($pattern in $requiredDllPatterns) {
            if (-not (Get-ChildItem -Path $dist -Filter $pattern -ErrorAction SilentlyContinue)) {
              throw "Expected runtime DLLs matching '$pattern' were not found in package output."
            }
          }

          Write-Host "Packaged runtime DLLs:"
          Get-ChildItem -Path $dist -Filter "*.dll" | Select-Object -ExpandProperty Name | Sort-Object | ForEach-Object {
            Write-Host " - $_"
          }

          $assetName = "yolov8_example-windows-x64-${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }}.zip"
          Compress-Archive -Path "$dist\\*" -DestinationPath $assetName -Force
          "asset=$assetName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-asset
          path: ${{ steps.package.outputs.asset }}

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }}
          files: ${{ steps.package.outputs.asset }}
          fail_on_unmatched_files: true
