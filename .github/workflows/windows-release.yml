name: Build and Release Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create/update (for example: v1.0.0)'
        required: true
        type: string
      onnxruntime_version:
        description: 'ONNX Runtime version'
        required: false
        default: '1.18.1'
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    env:
      BUILD_TYPE: Release
      VCPKG_ROOT: ${{ github.workspace }}\\vcpkg
      ONNXRUNTIME_VERSION: ${{ github.event.inputs.onnxruntime_version || '1.18.1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup vcpkg and install OpenCV
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\\bootstrap-vcpkg.bat"
          & "$env:VCPKG_ROOT\\vcpkg.exe" install opencv4[core,dnn,imgcodecs,imgproc]:x64-windows

      - name: Download ONNX Runtime
        shell: pwsh
        run: |
          $zipName = "onnxruntime-win-x64-$env:ONNXRUNTIME_VERSION.zip"
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v$env:ONNXRUNTIME_VERSION/$zipName"
          Invoke-WebRequest -Uri $url -OutFile $zipName
          Expand-Archive -Path $zipName -DestinationPath $env:GITHUB_WORKSPACE -Force
          $onnxDir = Join-Path $env:GITHUB_WORKSPACE "onnxruntime-win-x64-$env:ONNXRUNTIME_VERSION"
          "ONNXRUNTIME_DIR=$onnxDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=$env:BUILD_TYPE `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\\scripts\\buildsystems\\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DONNXRUNTIME_DIR="$env:ONNXRUNTIME_DIR" `
            -DYOLOV8_ENABLE_CUDA_PROVIDER=OFF

      - name: Build executable
        shell: pwsh
        run: |
          cmake --build build --config $env:BUILD_TYPE --target yolov8_example

      - name: Package executable
        id: package
        shell: pwsh
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE dist
          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          Copy-Item "build\\Release\\yolov8_example.exe" -Destination $dist -Force

          $onnxDll = Join-Path $env:ONNXRUNTIME_DIR "lib\\onnxruntime.dll"
          if (Test-Path $onnxDll) {
            Copy-Item $onnxDll -Destination $dist -Force
          }

          $opencvBin = Join-Path $env:VCPKG_ROOT "installed\\x64-windows\\bin"
          if (Test-Path $opencvBin) {
            Get-ChildItem -Path $opencvBin -Filter "opencv*.dll" | ForEach-Object {
              Copy-Item $_.FullName -Destination $dist -Force
            }
          }

          $assetName = "yolov8_example-windows-x64-${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }}.zip"
          Compress-Archive -Path "$dist\\*" -DestinationPath $assetName -Force
          "asset=$assetName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-asset
          path: ${{ steps.package.outputs.asset }}

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag }}
          files: ${{ steps.package.outputs.asset }}
          fail_on_unmatched_files: true
